<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パル図鑑 | Palworld攻略ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #07090d; --panel: #121822; --panel2: #182030;
    --parchment: #e9eef4; --parchment-dim: #8592a3;
    --brass: #f0b840; --brass-dim: #b5852f;
    --teal: #35d2ff; --teal-dim: #1c6d86;
    --lime: #e3ff3d; --lime-dim: #96b31f;
    --magenta: #ff2e7e; --magenta-dim: #a01a52;
    --line: rgba(142,183,214,.16); --danger: #e2543f;
    --hp: #7bdb52; --sp: #f0a233;
    --font-body: "Hiragino Sans","Yu Gothic",sans-serif;
    --font-display: "Rajdhani","Zen Kaku Gothic New", var(--font-body);
    --font-mono: "JetBrains Mono", monospace;
    /* element type colors */
    --t-無: #a7aeb8; --t-炎: #ef7148; --t-水: #3f93d6; --t-雷: #ecc23f;
    --t-地: #b98a4e; --t-草: #6dbf4f; --t-氷: #63d9e3; --t-竜: #9a6ff0; --t-闇: #8064b8;
  }
  ::selection{background:var(--lime);color:#0a0d12;}
  *{box-sizing:border-box;}
  body{margin:0;background:
    radial-gradient(circle at 12% -8%, #143241 0%, transparent 40%),
    radial-gradient(circle at 100% 100%, rgba(240,184,64,.06) 0%, transparent 42%),
    var(--bg);
    color:var(--parchment);font-family:var(--font-body);padding:0;}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px;}

  /* header */
  header.top{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-badge{width:42px;height:42px;border-radius:8px;background:linear-gradient(160deg, #1c2733, #10151c);border:1px solid var(--teal-dim);box-shadow:0 0 0 1px rgba(0,0,0,.4), inset 0 0 12px rgba(53,210,255,.12);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--teal);flex-shrink:0;}
  h1.title{font-family:var(--font-display);font-weight:700;font-size:27px;margin:0;color:var(--parchment);letter-spacing:.03em;}
  .title small{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--brass);letter-spacing:.22em;text-transform:uppercase;margin-bottom:3px;}
  nav.tabs{display:flex;gap:2px;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:8px;padding:3px;}
  nav.tabs a{font-size:12.5px;color:var(--parchment-dim);text-decoration:none;padding:7px 14px;border-radius:6px;font-weight:600;transition:color .12s,background .12s;}
  nav.tabs a:hover{color:var(--parchment);}
  nav.tabs a.current{color:#08222c;background:var(--teal);font-weight:700;box-shadow:0 0 10px rgba(53,210,255,.4);}

  /* controls */
  .controls{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:18px;box-shadow:0 8px 24px rgba(0,0,0,.25);}
  .controls-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  #searchBox{flex:1;min-width:160px;background:var(--panel2);border:1px solid var(--line);color:var(--parchment);border-radius:5px;padding:8px 12px;font-size:13.5px;font-family:var(--font-body);}
  #searchBox::placeholder{color:var(--parchment-dim);}
  #searchBox:focus,select#sortSel:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 2px rgba(53,210,255,.2);}
  select#sortSel{background:var(--panel2);border:1px solid var(--line);color:var(--parchment);border-radius:5px;padding:8px 10px;font-size:13px;}
  .count-tag{font-size:12px;color:var(--parchment-dim);font-family:var(--font-mono);white-space:nowrap;}
  .type-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .chip{font-size:12px;padding:5px 11px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);color:var(--parchment-dim);cursor:pointer;user-select:none;transition:transform .1s,border-color .1s;}
  .chip:hover{transform:translateY(-1px);border-color:var(--teal-dim);}
  .chip.active{color:#0d1013;font-weight:700;border-color:transparent;}
  .chip[data-t="無"].active{background:var(--t-無);} .chip[data-t="炎"].active{background:var(--t-炎);color:#fff;}
  .chip[data-t="水"].active{background:var(--t-水);color:#fff;} .chip[data-t="雷"].active{background:var(--t-雷);}
  .chip[data-t="地"].active{background:var(--t-地);color:#fff;} .chip[data-t="草"].active{background:var(--t-草);color:#fff;}
  .chip[data-t="氷"].active{background:var(--t-氷);} .chip[data-t="竜"].active{background:var(--t-竜);color:#fff;}
  .chip[data-t="闇"].active{background:var(--t-闇);color:#fff;}

  /* grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 10px 10px;cursor:pointer;position:relative;text-align:center;transition:border-color .12s, transform .12s;}
  .card:hover{border-color:var(--teal-dim);transform:translateY(-2px);}
  .card:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  .card .icon-wrap{position:relative;width:64px;height:64px;margin:0 auto 8px;border-radius:50%;background:var(--panel2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .card .icon-wrap img{width:100%;height:100%;object-fit:cover;}
  .card .icon-wrap::after{content:"";position:absolute;inset:-5px;opacity:0;transition:opacity .12s;pointer-events:none;
    background:
      linear-gradient(var(--teal),var(--teal)) top left / 9px 2px no-repeat,
      linear-gradient(var(--teal),var(--teal)) top left / 2px 9px no-repeat,
      linear-gradient(var(--teal),var(--teal)) top right / 9px 2px no-repeat,
      linear-gradient(var(--teal),var(--teal)) top right / 2px 9px no-repeat,
      linear-gradient(var(--teal),var(--teal)) bottom left / 9px 2px no-repeat,
      linear-gradient(var(--teal),var(--teal)) bottom left / 2px 9px no-repeat,
      linear-gradient(var(--teal),var(--teal)) bottom right / 9px 2px no-repeat,
      linear-gradient(var(--teal),var(--teal)) bottom right / 2px 9px no-repeat;
  }
  .card:hover .icon-wrap::after, .card:focus-visible .icon-wrap::after{opacity:1;}
  .card .pname{font-size:13px;font-weight:700;color:var(--parchment);margin-bottom:2px;line-height:1.25;}
  .card .pname-en{font-size:10px;color:var(--parchment-dim);font-family:var(--font-mono);margin-bottom:6px;}
  .card .types{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;}
  .type-badge{font-size:10px;padding:2px 7px;border-radius:4px;color:#fff;font-weight:700;}
  .type-badge.type-無{background:var(--t-無);color:#191c20;} .type-badge.type-炎{background:var(--t-炎);}
  .type-badge.type-水{background:var(--t-水);} .type-badge.type-雷{background:var(--t-雷);color:#191c20;}
  .type-badge.type-地{background:var(--t-地);} .type-badge.type-草{background:var(--t-草);}
  .type-badge.type-氷{background:var(--t-氷);color:#0a2226;} .type-badge.type-竜{background:var(--t-竜);}
  .type-badge.type-闇{background:var(--t-闇);}
  .card .num-badge{position:absolute;top:6px;left:8px;font-size:9.5px;color:var(--parchment-dim);font-family:var(--font-mono);}
  .card .night-badge{position:absolute;top:6px;right:8px;font-size:12px;}

  .empty-msg{grid-column:1/-1;text-align:center;padding:40px 0;color:var(--parchment-dim);font-size:13px;}

  /* detail */
  #detailView{display:none;}
  .back-btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);color:var(--parchment-dim);font-size:12.5px;padding:7px 14px;border-radius:6px;cursor:pointer;margin-bottom:16px;}
  .back-btn:hover{border-color:var(--teal-dim);color:var(--parchment);}
  .detail-head{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.25);}
  .medallion{position:relative;width:112px;height:112px;flex-shrink:0;}
  .medallion .ring{width:112px;height:112px;border-radius:50%;background:var(--panel2);border:3px solid var(--brass);overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 0 18px rgba(240,184,64,.18);}
  .medallion .ring img{width:100%;height:100%;object-fit:cover;}
  .medallion .rivet{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:inset 0 1px 1px rgba(0,0,0,.4), 0 0 0 2px var(--bg), 0 0 5px rgba(53,210,255,.7);}
  .medallion .rivet.nw{top:2px;left:16px;} .medallion .rivet.ne{top:2px;right:16px;}
  .medallion .rivet.sw{bottom:2px;left:16px;} .medallion .rivet.se{bottom:2px;right:16px;}
  .detail-info{flex:1;min-width:220px;}
  .detail-info .dname{font-family:var(--font-display);font-weight:700;font-size:29px;color:var(--parchment);line-height:1.15;letter-spacing:.01em;}
  .detail-info .dname-en{font-size:12.5px;color:var(--brass);font-family:var(--font-mono);margin-bottom:8px;}
  .badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .badge{font-size:11.5px;padding:3px 10px;border-radius:4px;border:1px solid var(--line);background:var(--panel2);color:var(--parchment-dim);}
  .badge.day{color:#e8d27a;border-color:#7a6a3a;} .badge.night{color:#9db8e0;border-color:#3a4a6a;}
  .badge.ride{background:#122a30;color:#7bdcef;border:1px solid var(--teal-dim);}
  .badge.dark{background:#221a30;border-color:#4a3a5c;color:#c7a8e0;}

  .section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);}
  .section h2{font-size:11.5px;margin:-16px -18px 14px;padding:10px 18px;background:rgba(0,0,0,.24);border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;color:var(--brass);letter-spacing:.1em;text-transform:uppercase;font-weight:700;}
  .caveat{font-size:11.5px;color:#e7c3af;background:#3a2a20;border:1px solid var(--danger);border-radius:6px;padding:8px 12px;margin-bottom:12px;}

  .stat-grid{display:grid;grid-template-columns:1fr;gap:8px;}
  .stat-row{display:grid;grid-template-columns:70px 1fr 76px;align-items:center;gap:8px;}
  .stat-row .stat-label{font-size:11.5px;color:var(--parchment-dim);}
  .stat-row .stat-bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;border:1px solid var(--line);}
  .stat-row .stat-bar-fill{height:100%;background:linear-gradient(90deg, var(--brass-dim), var(--brass));}
  .stat-row .stat-val{font-family:var(--font-mono);font-size:12px;text-align:right;color:var(--parchment);line-height:1.3;}
  .stat-row .stat-rank{display:block;font-size:9px;color:var(--teal);font-weight:400;}
  .elem-matchup{display:flex;flex-wrap:wrap;gap:6px;}
  .elem-tag{font-size:11px;padding:3px 9px;border-radius:5px;font-weight:700;}
  .elem-tag.weak{background:rgba(226,84,63,.16);color:#ff8a75;border:1px solid rgba(226,84,63,.4);}
  .elem-tag.resist{background:rgba(53,210,255,.12);color:var(--teal);border:1px solid var(--teal-dim);}

  .role-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .role-pill{font-size:12px;padding:5px 11px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);color:var(--parchment);}
  .role-pill b{color:var(--teal);font-family:var(--font-mono);margin-left:4px;}

  .pskill-box{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:6px;padding:10px 14px;}
  .pskill-box .pskill-name{font-weight:700;color:var(--brass);margin-bottom:4px;font-size:13.5px;}
  .pskill-box .pskill-effect{font-size:12.5px;color:var(--parchment-dim);line-height:1.6;}

  .drop-list{display:flex;flex-direction:column;gap:6px;}
  .drop-item{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;}
  .drop-icon{width:20px;height:20px;object-fit:contain;flex-shrink:0;image-rendering:-webkit-optimize-contrast;}
  .drop-item .drop-name{flex:1;color:var(--parchment);}
  .drop-item .drop-qty{color:var(--parchment-dim);font-family:var(--font-mono);font-size:11.5px;}
  .drop-item .drop-rate{color:var(--teal);font-family:var(--font-mono);font-size:11.5px;min-width:48px;text-align:right;}
  .drop-tier{font-size:9.5px;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.24);color:var(--parchment-dim);border:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em;}
  .drop-tier.boss,.drop-tier.lv80{color:#ff8a75;border-color:rgba(226,84,63,.4);background:rgba(226,84,63,.12);}
  .drop-tier.lv70{color:#e8d27a;border-color:#7a6a3a;}

  .obtain-box{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px 14px;font-size:12.5px;color:var(--parchment-dim);line-height:1.7;}
  .obtain-box .obtain-label{color:var(--brass);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-right:6px;}
  .obtain-box .obtain-notes{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-style:italic;}

  .spawn-map-embed{margin-top:12px;}
  .spawn-map-embed iframe{width:100%;height:480px;border:1px solid var(--line);border-radius:8px;background:#04060a;display:block;}
  .spawn-map-link{display:inline-block;margin-top:8px;font-size:11.5px;color:var(--brass);text-decoration:none;}
  .spawn-map-link:hover{text-decoration:underline;}

  .footer-note{font-size:11px;color:var(--parchment-dim);text-align:center;margin-top:24px;}
  .footer-note a{color:var(--brass);}

  @media (max-width:520px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}
    .detail-info .dname{font-size:22px;}
  }

  /* ===== v2 signature system: hero / glitch / angular nav / motion ===== */
  .icon{display:inline-flex;width:1em;height:1em;vertical-align:-0.15em;}
  .icon svg{width:100%;height:100%;}

  h1.title, .hero-title{font-weight:900;}

  .glitch-hover{position:relative;display:inline-block;cursor:default;}
  .glitch-hover::before, .glitch-hover::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;opacity:0;}
  .glitch-hover:hover::before{opacity:.7;color:var(--lime);clip-path:inset(0 0 55% 0);transform:translate(-2px,-1px);animation:glitchShift .32s steps(2) infinite;}
  .glitch-hover:hover::after{opacity:.7;color:var(--magenta);clip-path:inset(55% 0 0 0);transform:translate(2px,1px);animation:glitchShift .32s steps(2) infinite reverse;}
  @keyframes glitchShift{0%{transform:translate(-2px,-1px);}50%{transform:translate(2px,1px);}100%{transform:translate(-1px,1px);}}

  nav.tabs{background:transparent;border:none;padding:0;gap:6px;}
  nav.tabs a{position:relative;font-size:12.5px;color:var(--parchment-dim);text-decoration:none;padding:9px 18px 9px 20px;font-weight:600;font-family:var(--font-display);letter-spacing:.02em;
    background:var(--panel2);border:1px solid var(--line);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);
    transition:color .15s, background .15s, transform .15s;}
  nav.tabs a span{position:relative;z-index:1;}
  nav.tabs a::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg, transparent 30%, rgba(227,255,61,.35) 48%, rgba(255,46,126,.35) 52%, transparent 70%);
    opacity:0;transition:opacity .2s;}
  nav.tabs a:hover{color:var(--parchment);transform:translateY(-1px);}
  nav.tabs a:hover::before{opacity:1;}
  nav.tabs a.current{color:#08111a;background:var(--lime);border-color:var(--lime);font-weight:700;box-shadow:0 0 16px rgba(227,255,61,.45);}
  nav.tabs a.current::before{display:none;}

  .hero{position:relative;height:264px;border-radius:10px;overflow:hidden;margin-bottom:20px;clip-path:polygon(0 0,100% 0,100% calc(100% - 26px),calc(100% - 40px) 100%,0 100%);
    border:1px solid var(--line);background:#060809;}
  .hero-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 35%;opacity:.85;filter:saturate(1.15) contrast(1.05);}
  .hero-scanlines{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.5;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0px, rgba(255,255,255,.06) 1px, transparent 1px, transparent 3px);}
  .hero-fade{position:absolute;inset:0;
    background:
      linear-gradient(100deg, var(--bg) 0%, rgba(7,9,13,.72) 26%, rgba(7,9,13,.15) 52%, transparent 68%),
      linear-gradient(0deg, var(--bg) 0%, transparent 42%);}
  .hero-content{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 28px;max-width:560px;}
  .hero-eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.18em;color:var(--lime);margin-bottom:10px;text-shadow:0 0 10px rgba(227,255,61,.5);}
  .hero-title{font-family:var(--font-display);font-size:40px;line-height:1;color:var(--parchment);letter-spacing:.02em;margin:0 0 10px;text-shadow:0 2px 24px rgba(0,0,0,.6);}
  .hero-title .accent{color:var(--magenta);text-shadow:0 0 18px rgba(255,46,126,.6);}
  .hero-sub{font-size:13px;color:var(--parchment-dim);max-width:400px;line-height:1.7;margin:0;}
  @media (max-width:640px){
    .hero{height:200px;}
    .hero-title{font-size:28px;}
    .hero-sub{display:none;}
  }

  .section h2{position:relative;display:flex;align-items:center;gap:8px;}
  .section h2::before{content:"";width:9px;height:9px;background:var(--lime);clip-path:polygon(0 20%,80% 0,100% 80%,20% 100%);flex-shrink:0;box-shadow:0 0 8px rgba(227,255,61,.6);}

  .chip, .back-btn, .card, nav.tabs a{transition:transform .15s cubic-bezier(.2,.8,.3,1.3), border-color .15s, box-shadow .15s, background .15s;}
  .chip:active, .back-btn:active, nav.tabs a:active{transform:scale(.96);}

  .back-btn{position:relative;overflow:hidden;font-family:var(--font-display);font-weight:600;letter-spacing:.02em;}
  .back-btn::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg, transparent, rgba(227,255,61,.25), transparent);transform:skewX(-20deg);transition:left .4s;}
  .back-btn:hover::before{left:120%;}
  .back-btn:hover{border-color:var(--lime-dim);color:var(--parchment);box-shadow:0 0 14px rgba(227,255,61,.12);}

  .card{overflow:hidden;}
  .card::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg, transparent 40%, rgba(227,255,61,.08) 50%, rgba(255,46,126,.08) 58%, transparent 68%);
    opacity:0;transition:opacity .2s;pointer-events:none;}
  .card:hover{border-color:var(--lime-dim);box-shadow:0 10px 28px rgba(0,0,0,.35), 0 0 0 1px rgba(227,255,61,.15);}
  .card:hover::after{opacity:1;}
  .card:hover .icon-wrap::after{background:
      linear-gradient(var(--lime),var(--lime)) top left / 9px 2px no-repeat,
      linear-gradient(var(--lime),var(--lime)) top left / 2px 9px no-repeat,
      linear-gradient(var(--magenta),var(--magenta)) top right / 9px 2px no-repeat,
      linear-gradient(var(--magenta),var(--magenta)) top right / 2px 9px no-repeat,
      linear-gradient(var(--magenta),var(--magenta)) bottom left / 9px 2px no-repeat,
      linear-gradient(var(--magenta),var(--magenta)) bottom left / 2px 9px no-repeat,
      linear-gradient(var(--lime),var(--lime)) bottom right / 9px 2px no-repeat,
      linear-gradient(var(--lime),var(--lime)) bottom right / 2px 9px no-repeat;
  }

  .medallion .ring{transition:box-shadow .2s;}
  .detail-head:hover .medallion .ring{box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 0 22px rgba(227,255,61,.28);}

  .brand-link{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;transition:opacity .15s;}
  .brand-link:hover{opacity:.82;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand-link" href="palworld_home.html">

<script src="game_data/dex_data.js"></script>

<script>

const SPAWN_BY_DEXID = {};
(SPAWN_DATA.pals || []).forEach(p => { SPAWN_BY_DEXID[p.dexId] = p; });

const TYPES = ["無","炎","水","雷","地","草","氷","竜","闇"];
const ROLE_ICON = {"火おこし":"flame","水やり":"droplet","種まき":"sprout","発電":"bolt","手作業":"wrench","採集":"basket","伐採":"axe","採掘":"pickaxe","製薬":"flask","冷却":"snowflake","運搬":"box","牧場":"paw"};

let state = { view:"list", query:"", activeTypes:new Set(), sort:"id", selectedId:null };

function typeBadge(t){ return `<span class="type-badge type-${t}">${t}</span>`; }

function renderChips(){
  const wrap = document.getElementById("typeChips");
  wrap.innerHTML = TYPES.map(t => `<span class="chip" data-t="${t}">${t}</span>`).join("");
  wrap.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const t = chip.dataset.t;
      if(state.activeTypes.has(t)) state.activeTypes.delete(t); else state.activeTypes.add(t);
      chip.classList.toggle("active");
      renderGrid();
    });
  });
}

// ひらがな入力でもカタカナのパル名にヒットするよう、ひらがなをカタカナに正規化して比較する
// (パル名はほぼカタカナ表記のため。「る」で検索→「ル」を含む名前にもヒットする)
function toKana(str){
  return (str||"").replace(/[ぁ-ゖ]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60));
}

function filteredSorted(){
  let list = PAL_DEX_DATA.filter(p => {
    if(state.query){
      const q = state.query.toLowerCase();
      const hit = toKana(p.name).includes(toKana(state.query)) || (p.en_name && p.en_name.toLowerCase().includes(q));
      if(!hit) return false;
    }
    if(state.activeTypes.size > 0){
      const hasType = p.types.some(t => state.activeTypes.has(t));
      if(!hasType) return false;
    }
    return true;
  });
  if(state.sort === "name") list = list.slice().sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  else if(state.sort === "rarity_desc") list = list.slice().sort((a,b)=>(b.stats&&b.stats.rarity||0)-(a.stats&&a.stats.rarity||0));
  else if(state.sort === "rarity_asc") list = list.slice().sort((a,b)=>(a.stats&&a.stats.rarity||0)-(b.stats&&b.stats.rarity||0));
  else list = list.slice().sort((a,b)=>Number(a.id)-Number(b.id));
  return list;
}

function renderGrid(){
  const list = filteredSorted();
  document.getElementById("countTag").textContent = `全${PAL_DEX_DATA.length}体中 ${list.length}体表示`;
  const grid = document.getElementById("cardGrid");
  if(list.length === 0){
    grid.innerHTML = `<div class="empty-msg">条件に合うパルが見つかりません</div>`;
    return;
  }
  grid.innerHTML = list.map(p => `
    <div class="card" data-id="${p.id}" tabindex="0" role="button" aria-label="${p.name}の詳細">
      <span class="num-badge">#${p.id}</span>
      <span class="night-badge">${p.active_time==="夜"?ico("moon"):p.active_time==="両方"?ico("sun")+ico("moon"):ico("sun")}</span>
      <div class="icon-wrap">${p.icon ? `<img src="${p.icon}" alt="${p.name}" loading="lazy">` : ""}</div>
      <div class="pname">${p.name}</div>
      <div class="pname-en">${p.en_name || ""}</div>
      <div class="types">${p.types.map(typeBadge).join("")}</div>
    </div>
  `).join("");
  grid.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => openDetail(card.dataset.id));
    card.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openDetail(card.dataset.id); } });
  });
}

// 種族値・ライド速度の全パル中の順位を計算する(既存の種族値データのみから算出。
// 外部ソース不要・捏造リスク無し)
const STAT_RANK_KEYS = ["hp","melee_attack","shot_attack","defense","craft_speed","run_speed","ride_sprint_speed"];
const STAT_RANKS = {};
STAT_RANK_KEYS.forEach(key => {
  const withVal = PAL_DEX_DATA.filter(p => p.stats && typeof p.stats[key] === "number");
  const sorted = withVal.slice().sort((a,b) => b.stats[key] - a.stats[key]);
  const rankMap = {};
  sorted.forEach((p,i) => { rankMap[p.id] = i+1; });
  STAT_RANKS[key] = { rankMap, total: withVal.length };
});
function statRankText(id, key){
  const r = STAT_RANKS[key];
  if(!r || !(id in r.rankMap)) return "";
  return `${r.rankMap[id]}位/${r.total}`;
}

// 属性相性表(palworld-lab.comの相性チェッカーツールで検証、シェルガドラ実例の
// 弱点/耐性表示と照合して一致を確認済み)。beats[X]=[Y,...] は「Xで攻撃するとYに1.5倍」。
// 無属性は特例: 攻撃側として使っても常に等倍、かつ防御側としても同属性耐性を受けない。
const ELEMENT_BEATS = {
  "炎": ["草","氷"], "草": ["地"], "地": ["雷"], "雷": ["水"], "水": ["炎"],
  "氷": ["竜"], "竜": ["闇"], "闇": ["無"], "無": [],
};
function elementMultiplier(attackerType, defenderType){
  if(attackerType === "無") return 1; // 無属性は攻撃側として常に等倍
  if(ELEMENT_BEATS[attackerType].includes(defenderType)) return 1.5;
  if(defenderType === "無") return 1; // 無属性は防御側としても耐性を受けない特例
  if(attackerType === defenderType) return 0.66; // 同属性は耐性
  if(ELEMENT_BEATS[defenderType] && ELEMENT_BEATS[defenderType].includes(attackerType)) return 0.66; // 弱点の逆向き
  return 1;
}
function elementMatchup(defenderTypes){
  // 複属性は各属性の倍率を掛け合わせる(両方弱点なら1.5×1.5=2.25、等)
  const weak = [], resist = [];
  TYPES.forEach(atk => {
    let mult = 1;
    defenderTypes.forEach(def => { mult *= elementMultiplier(atk, def); });
    if(Math.abs(mult - 1) < 0.001) return;
    (mult > 1 ? weak : resist).push({ type: atk, mult });
  });
  weak.sort((a,b)=>b.mult-a.mult);
  resist.sort((a,b)=>a.mult-b.mult);
  return { weak, resist };
}

function statRow(label, val, max, id, key){
  const pct = Math.min(100, Math.round((val/max)*100));
  const rankText = (id && key) ? statRankText(id, key) : "";
  return `<div class="stat-row">
    <div class="stat-label">${label}</div>
    <div class="stat-bar"><div class="stat-bar-fill" style="width:${pct}%"></div></div>
    <div class="stat-val">${val}${rankText ? `<span class="stat-rank">${rankText}</span>` : ''}</div>
  </div>`;
}

function openDetail(id){
  const p = PAL_DEX_DATA.find(x => x.id === id);
  if(!p) return;
  state.selectedId = id;
  const workEntries = Object.entries(p.work).sort((a,b)=>b[1]-a[1]);
  const rideBadges = [
    p.ride.rideable ? '<span class="badge ride">乗れる</span>' : '',
    p.ride.fly ? '<span class="badge ride">飛べる</span>' : '',
    p.ride.swim ? '<span class="badge ride">泳げる</span>' : '',
  ].join("");
  const timeBadge = p.active_time === "夜" ? `<span class="badge night">${ico("moon")} 夜行性</span>`
    : p.active_time === "両方" ? `<span class="badge day">${ico("sun")} 昼</span><span class="badge night">${ico("moon")} 夜</span>`
    : `<span class="badge day">${ico("sun")} 昼行性</span>`;
  const darkBadge = p.is_dark_type ? '<span class="badge dark">闇属性</span>' : '';

  let statsHtml = "";
  if(p.stats){
    const caveat = p.stats_status === "variant_fallback"
      ? `<div class="caveat">${ico("warning")} このパルは1.0で追加された属性違い個体のため、種族値の実測データがありません。近縁種(通常種)の種族値を参考値として表示しています。実際の値と異なる可能性があります。</div>`
      : "";
    statsHtml = `<div class="section">
      <h2>種族値</h2>
      ${caveat}
      <div class="stat-grid">
        ${statRow("HP", p.stats.hp, 200, id, "hp")}
        ${statRow("近接攻撃", p.stats.melee_attack, 200, id, "melee_attack")}
        ${statRow("遠隔攻撃", p.stats.shot_attack, 200, id, "shot_attack")}
        ${statRow("防御", p.stats.defense, 200, id, "defense")}
        ${statRow("作業速度", p.stats.craft_speed, 200, id, "craft_speed")}
      </div>
      <div class="badge-row" style="margin-top:10px;">
        <span class="badge">レア度 ${ico("star")}${p.stats.rarity ?? "?"}</span>
        <span class="badge">サイズ ${(p.stats.size||"").replace("EPalSizeType::","")}</span>
        <span class="badge">走行速度 ${p.stats.run_speed ?? "?"}${statRankText(id,"run_speed") ? `(${statRankText(id,"run_speed")})` : ''}</span>
        <span class="badge">ライド疾走速度 ${p.stats.ride_sprint_speed ?? "?"}${statRankText(id,"ride_sprint_speed") ? `(${statRankText(id,"ride_sprint_speed")})` : ''}</span>
      </div>
    </div>`;
  }

  const extra = PALDB_EXTRA_DATA[id];
  const innatePassivesHtml = (extra && extra.innate_passives && extra.innate_passives.length) ? `<div class="section">
    <h2>最初から持っているパッシブ</h2>
    <div class="role-grid">
      ${extra.innate_passives.map(n => `<span class="role-pill">${n}</span>`).join("")}
    </div>
  </div>` : "";

  const dropsHtml = (extra && extra.drops && extra.drops.length) ? `<div class="section">
    <h2>ドロップアイテム</h2>
    <div class="drop-list">
      ${extra.drops.map(d => `<div class="drop-item">
        ${ITEM_ICONS[d.item] ? `<img class="drop-icon" src="${ITEM_ICONS[d.item]}" alt="">` : ""}
        ${d.tier && d.tier !== "normal" ? `<span class="drop-tier ${d.tier}">${d.tier}</span>` : ""}
        <span class="drop-name">${d.item}</span>
        <span class="drop-qty">×${d.qty}</span>
        <span class="drop-rate">${d.rate}</span>
      </div>`).join("")}
    </div>
  </div>` : "";

  const obtain = extra && extra.obtain;
  const spawn = SPAWN_BY_DEXID[p.id];
  const spawnMapHtml = (spawn && ((spawn.wildZones && spawn.wildZones.length) || (spawn.alphaZones && spawn.alphaZones.length))) ? `
    <div class="spawn-map-embed">
      <iframe src="palworld_map.html?id=${p.id}&embed=1" loading="lazy" title="${p.name}の出現マップ"></iframe>
      <a class="spawn-map-link" href="palworld_map.html?id=${p.id}" target="_blank" rel="noopener">出現マップを別タブで開く →</a>
    </div>` : "";
  const obtainHtml = (obtain && ((obtain.locations && obtain.locations.length) || obtain.egg_type || obtain.notes)) || spawnMapHtml ? `<div class="section">
    <h2>入手方法</h2>
    ${obtain ? `<div class="obtain-box">
      ${obtain.locations && obtain.locations.length ? `<div><span class="obtain-label">生息地</span>${obtain.locations.join(" / ")}</div>` : ""}
      ${obtain.egg_type ? `<div><span class="obtain-label">タマゴ</span>${obtain.egg_type}</div>` : ""}
      ${obtain.boss_only ? `<div><span class="obtain-label">出現</span>ボス個体のみ</div>` : ""}
      ${obtain.notes ? `<div class="obtain-notes">${obtain.notes}</div>` : ""}
    </div>` : ""}
    ${spawnMapHtml}
  </div>` : "";

  const matchup = elementMatchup(p.types);
  const matchupHtml = `<div class="section">
    <h2>属性相性(被ダメージ倍率)</h2>
    <div class="elem-matchup">
      ${matchup.weak.map(w => `<span class="elem-tag weak">${w.type} ×${w.mult.toFixed(2).replace(/\.?0+$/,'')}</span>`).join("")}
      ${matchup.resist.map(r => `<span class="elem-tag resist">${r.type} ×${r.mult.toFixed(2).replace(/\.?0+$/,'')}</span>`).join("")}
      ${(!matchup.weak.length && !matchup.resist.length) ? '<span style="color:var(--parchment-dim);font-size:12px;">弱点・耐性なし(全属性等倍)</span>' : ''}
    </div>
    <p style="font-size:10px;color:var(--parchment-dim);margin-top:8px;">赤=弱点(1.5倍以上のダメージを受ける) / 青=耐性(0.66倍以下)。属性相性のみの倍率(属性一致ボーナス等は含みません)。出典: palworld-lab.com属性相性表(検証済み)</p>
  </div>`;

  document.getElementById("detailContent").innerHTML = `
    <div class="detail-head">
      <div class="medallion">
        <div class="ring">${p.icon ? `<img src="${p.icon}" alt="${p.name}">` : ""}</div>
        <span class="rivet nw"></span><span class="rivet ne"></span><span class="rivet sw"></span><span class="rivet se"></span>
      </div>
      <div class="detail-info">
        <div class="dname">${p.name}</div>
        <div class="dname-en">${p.en_name || ""} ・ #${p.id}</div>
        <div class="badge-row">${p.types.map(typeBadge).join("")}${timeBadge}${darkBadge}</div>
        ${rideBadges ? `<div class="badge-row">${rideBadges}</div>` : ""}
      </div>
    </div>
    ${statsHtml}
    ${matchupHtml}
    <div class="section">
      <h2>作業適性</h2>
      <div class="role-grid">
        ${workEntries.length ? workEntries.map(([r,lv])=>`<span class="role-pill">${ico(ROLE_ICON[r])} ${r} <b>Lv${lv}</b></span>`).join("") : '<span style="color:var(--parchment-dim);font-size:12.5px;">作業適性なし</span>'}
      </div>
    </div>
    <div class="section">
      <h2>パートナースキル</h2>
      <div class="pskill-box">
        <div class="pskill-name">◆ ${p.partner_skill.name}</div>
        <div class="pskill-effect">${p.partner_skill.effect}</div>
      </div>
    </div>
    ${innatePassivesHtml}
    ${dropsHtml}
    ${obtainHtml}
    <p class="footer-note"><a href="${p.detail_url}" target="_blank" rel="noopener">${p.detail_url.includes("paldb.cc") ? "paldb.ccで詳細を見る →" : "GameWithで詳細を見る →"}</a></p>
    <div style="text-align:center;margin-top:6px;">
      <a href="palworld_breeding.html?target=${p.id}" class="back-btn" style="display:inline-flex;text-decoration:none;margin-bottom:0;">${ico("dna")} 配合を調べる →</a>
    </div>
  `;
  document.getElementById("listView").style.display = "none";
  document.getElementById("detailView").style.display = "block";
  window.scrollTo(0,0);
}

function closeDetail(){
  document.getElementById("detailView").style.display = "none";
  document.getElementById("listView").style.display = "block";
}

document.getElementById("searchBox").addEventListener("input", e => { state.query = e.target.value; renderGrid(); });
document.getElementById("sortSel").addEventListener("change", e => { state.sort = e.target.value; renderGrid(); });
document.getElementById("backBtn").addEventListener("click", closeDetail);

renderChips();
renderGrid();

const initialParams = new URLSearchParams(location.search);
const initialId = initialParams.get("id");
if(initialId && PAL_DEX_DATA.some(p => p.id === initialId)){
  openDetail(initialId);
}
</script>
