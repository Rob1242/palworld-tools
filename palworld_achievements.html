<style>

  .wrap{max-width:1400px;margin:0 auto;padding:22px 20px 60px;}

  header.top{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line);}
  .brand-badge{width:42px;height:42px;border-radius:8px;background:var(--panel2);border:1px solid var(--teal-dim);box-shadow:0 0 0 1px rgba(0,0,0,.4), inset 0 0 12px rgba(53,210,255,.12);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--teal);flex-shrink:0;}

  .title small{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--brass);letter-spacing:.22em;text-transform:uppercase;margin-bottom:3px;}

  .intro{font-size:13px;color:var(--parchment-dim);line-height:1.8;margin:0 0 20px;}

  .ach-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:10px;}
  .ach-item{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;box-shadow:0 6px 18px rgba(0,0,0,.2);}
  .ach-badge{width:36px;height:36px;border-radius:8px;background:var(--panel2);border:1px solid var(--brass-dim);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:var(--brass);flex-shrink:0;font-size:14px;}
  .ach-name{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--parchment);min-width:140px;}
  .ach-cond{font-size:13px;color:var(--parchment-dim);}

  .footer-note{font-size:11px;color:var(--parchment-dim);text-align:center;margin-top:24px;}

  /* auto-fill+minmax(420px,..)は列の最小幅そのものが狭い画面より広いため、
     スマホ幅では1列に切り替えないと横はみ出しが起きる(2026-07-22、iframeでの
     モバイル幅検証で発覚)。 */
  @media (max-width:480px){
    .ach-list{grid-template-columns:1fr;}
    .ach-item{flex-wrap:wrap;}
  }
