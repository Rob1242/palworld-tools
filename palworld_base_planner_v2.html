<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  :root{
    --bg: #21241f; --panel: #2b2f27; --panel2: #343a2f;
    --parchment: #ece3cc; --parchment-dim: #cfc6ab;
    --brass: #c9973f; --brass-dim: #9c7530;
    --teal: #4f8b7a; --teal-dim: #35604f;
    --line: #4a5140; --danger: #b5583f;
    font-family: "Hiragino Sans","Yu Gothic",sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--parchment);padding:20px;}
  .wrap{max-width:960px;margin:0 auto;}
  .title{font-size:20px;font-weight:700;margin:0 0 4px;}
  .subtitle{font-size:12.5px;color:var(--parchment-dim);margin:0 0 20px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:16px;}
  .panel h2{font-size:13px;margin:0 0 12px;color:var(--brass);letter-spacing:.05em;text-transform:uppercase;font-weight:700;}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .row label{font-size:13px;color:var(--parchment-dim);min-width:110px;}
  input[type=range]{flex:1;accent-color:var(--brass);}
  input[type=number]{width:64px;background:var(--panel2);border:1px solid var(--line);color:var(--parchment);border-radius:4px;padding:4px 6px;font-size:13px;}
  .toggle-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);}
  .toggle-row:last-child{border-bottom:none;}
  .toggle-label{font-size:13px;}
  .toggle-desc{font-size:11px;color:var(--parchment-dim);margin-top:2px;}
  .switch{position:relative;width:40px;height:22px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;cursor:pointer;flex-shrink:0;}
  .switch.on{background:var(--teal-dim);border-color:var(--teal);}
  .switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--parchment-dim);transition:left .15s;}
  .switch.on .knob{left:20px;background:var(--parchment);}
  .roles-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px;}
  .role-item{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .role-name{font-size:12.5px;min-width:56px;}
  .weight-btns{display:flex;gap:3px;}
  .wbtn{width:26px;height:24px;border-radius:3px;border:1px solid var(--line);background:var(--panel2);color:var(--parchment-dim);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .wbtn.active{background:var(--brass-dim);border-color:var(--brass);color:var(--parchment);}
  .compute-btn{width:100%;padding:11px;background:var(--brass-dim);border:1px solid var(--brass);color:var(--parchment);font-size:14px;font-weight:700;border-radius:5px;cursor:pointer;}
  .compute-btn:hover{background:var(--brass);}
  .compute-btn:disabled{opacity:.5;cursor:default;}
  .summary{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .metric{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px;flex:1;min-width:100px;}
  .metric .num{font-size:18px;font-weight:700;color:var(--brass);}
  .metric .lbl{font-size:10.5px;color:var(--parchment-dim);margin-top:2px;}
  .coverage-warn{background:#3a2a20;border:1px solid var(--danger);color:#e7c3af;border-radius:5px;padding:8px 12px;font-size:12px;margin-bottom:12px;}
  .progress-log{font-size:11px;color:var(--parchment-dim);margin-bottom:12px;font-family:monospace;}
  .slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px;}
  .slot{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;position:relative;}
  .slot .num-badge{position:absolute;top:8px;right:10px;font-size:10px;color:var(--parchment-dim);}
  .slot .pname{font-size:14px;font-weight:700;margin-bottom:2px;padding-right:24px;}
  .slot .ptype{font-size:10.5px;color:var(--parchment-dim);margin-bottom:6px;}
  .badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:3px;margin-right:4px;margin-bottom:2px;}
  .badge.day{background:#4a4020;color:#e8cf7a;border:1px solid #7a6a30;}
  .badge.night{background:#242a4a;color:#9fb0e8;border:1px solid #3d4a7a;}
  .badge.role{background:var(--panel2);color:var(--teal);border:1px solid var(--teal-dim);}
  .badge.passive{background:#2f2540;color:#c9a8e8;border:1px solid #5a3d7a;}
  .slot .pskill{font-size:10.5px;color:var(--parchment-dim);margin-top:6px;border-top:1px solid var(--line);padding-top:6px;line-height:1.4;}
  .empty-slot{border-style:dashed;color:var(--parchment-dim);display:flex;align-items:center;justify-content:center;font-size:12px;min-height:70px;}
</style>
</head>
<body>
<div class="wrap">
  <p class="title">拠点配置プランナー v2</p>
  <p class="subtitle">基礎適正Lv + 理想パッシブ理論値で実効スコアを計算し、局所探索で組み合わせを反復改善します。</p>

  <div class="panel">
    <h2>拠点設定</h2>
    <div class="row">
      <label>拠点の枠数</label>
      <input type="range" id="slotRange" min="1" max="50" value="15">
      <input type="number" id="slotNum" min="1" max="50" value="15">
    </div>
    <div class="toggle-row">
      <div><div class="toggle-label">昼夜バランス重視</div><div class="toggle-desc">重要な役職は昼型・夜型を揃えて24時間稼働を狙う(不足時は不眠系パッシブで補完)</div></div>
      <div class="switch on" id="toggleDayNight"><div class="knob"></div></div>
    </div>
    <div class="toggle-row">
      <div><div class="toggle-label">汎用型を優先</div><div class="toggle-desc">複数役職を高Lvでこなせるパルの評価を上げる</div></div>
      <div class="switch on" id="toggleGeneralist"><div class="knob"></div></div>
    </div>
    <div class="toggle-row">
      <div><div class="toggle-label">理想パッシブを適用</div><div class="toggle-desc">各パルに実在するパッシブ(超絶技巧・職人気質など)を4枠仮定して実効値を計算</div></div>
      <div class="switch on" id="togglePassive"><div class="knob"></div></div>
    </div>
  </div>

  <div class="panel">
    <h2>役職の重要度</h2>
    <div class="roles-grid" id="rolesGrid"></div>
  </div>

  <button class="compute-btn" id="computeBtn">この条件で最適配置を計算する</button>

  <div id="resultArea" style="margin-top:20px;"></div>
</div>

,"work":{"手作業":2,"製薬":4,"運搬":2},"meal":4,"pskill":"悪夢の視線"},{"name":"ゼノドラン","types":["闇","竜"],"active":"夜","work":{"採集":1},"meal":8,"pskill":"メテオウィング"},{"name":"レジェンディア","types":["無"],"active":"昼","work":{"採集":7,"伐採":7},"meal":9,"pskill":"セイクリッドバリア"},{"name":"セイントール","types":["無"],"active":"昼","work":{"伐採":2,"採掘":2},"meal":9,"pskill":"天翔の聖騎士"},{"name":"ベイントール","types":["闇"],"active":"夜","work":{"伐採":2,"採掘":2},"meal":9,"pskill":"深淵の黒騎士"},{"name":"グレイシャル","types":["氷"],"active":"昼","work":{"冷却":4},"meal":7,"pskill":"氷天馬"},{"name":"グレイシャドウ","types":["闇"],"active":"夜","work":{"採集":4},"meal":7,"pskill":"黒天馬"},{"name":"ネプティオス","types":["水"],"active":"昼","work":{"水やり":4,"運搬":2},"meal":7,"pskill":"大海の覇者"},{"name":"ジェッドラン","types":["竜"],"active":"昼","work":{"採集":3},"meal":9,"pskill":"エアリアルミサイル"},{"name":"グランジーラ","types":["水"],"active":"昼","work":{},"meal":9,"pskill":"残響の守護者"}]
;

const PASSIVE_POOL = {"speed": [{"name": "超絶技巧", "pct": 75.0}, {"name": "職人気質", "pct": 50.0}, {"name": "社畜", "pct": 30.0}, {"name": "希少", "pct": 20.0}, {"name": "まじめ", "pct": 20.0}, {"name": "うぬぼれ屋", "pct": 10.0}], "night": [{"name": "吸血鬼", "pct": 0}, {"name": "不眠", "pct": 0}]}
;


const ROLES = ["火おこし","水やり","種まき","発電","手作業","採集","伐採","採掘","製薬","冷却","運搬","牧場"];
const roleWeights = {};
ROLES.forEach(r => roleWeights[r] = (r==="手作業"||r==="運搬") ? 2 : 1);

let dayNightBalance = true;
let generalistPref = true;
let usePassive = true;

const rolesGrid = document.getElementById('rolesGrid');
ROLES.forEach(role => {
  const item = document.createElement('div');
  item.className = 'role-item';
  item.innerHTML = `<span class="role-name">${role}</span>
    <div class="weight-btns" data-role="${role}">
      <div class="wbtn" data-w="0">無</div><div class="wbtn" data-w="1">低</div>
      <div class="wbtn" data-w="2">中</div><div class="wbtn" data-w="3">高</div>
    </div>`;
  rolesGrid.appendChild(item);
});
function refreshWeightButtons(){
  document.querySelectorAll('.weight-btns').forEach(group => {
    const role = group.dataset.role;
    group.querySelectorAll('.wbtn').forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.dataset.w) === roleWeights[role]);
    });
  });
}
rolesGrid.addEventListener('click', (e) => {
  const btn = e.target.closest('.wbtn');
  if(!btn) return;
  const group = btn.closest('.weight-btns');
  roleWeights[group.dataset.role] = parseInt(btn.dataset.w);
  refreshWeightButtons();
});
refreshWeightButtons();

document.getElementById('toggleDayNight').addEventListener('click', function(){
  dayNightBalance = !dayNightBalance; this.classList.toggle('on', dayNightBalance);
});
document.getElementById('toggleGeneralist').addEventListener('click', function(){
  generalistPref = !generalistPref; this.classList.toggle('on', generalistPref);
});
document.getElementById('togglePassive').addEventListener('click', function(){
  usePassive = !usePassive; this.classList.toggle('on', usePassive);
});

const slotRange = document.getElementById('slotRange');
const slotNum = document.getElementById('slotNum');
slotRange.addEventListener('input', () => slotNum.value = slotRange.value);
slotNum.addEventListener('input', () => {
  let v = parseInt(slotNum.value)||1;
  v = Math.max(1, Math.min(50, v));
  slotNum.value = v; slotRange.value = v;
});

function baseScore(pal){
  let s = 0, roleCount = 0;
  for(const r in pal.work){
    const w = roleWeights[r] || 0;
    if(w > 0){ s += w * pal.work[r]; roleCount++; }
  }
  if(generalistPref && roleCount > 1) s *= (1 + 0.12*(roleCount-1));
  return s;
}

function idealPassiveLoadout(pal, wantNight){
  let slots = 4;
  let chosen = [];
  let alreadyNight = (pal.active === "夜" || pal.active === "両方");
  let addedNightPassive = false;
  if(wantNight && !alreadyNight){
    chosen.push(PASSIVE_POOL.night[0]);
    slots -= 1;
    addedNightPassive = true;
  }
  const speedPicks = PASSIVE_POOL.speed.slice(0, slots);
  chosen = chosen.concat(speedPicks);
  const totalPct = chosen.reduce((s,c)=>s+(c.pct||0),0);
  return { chosen, totalPct, isNightActive: alreadyNight || addedNightPassive };
}

function effectiveScoreOf(pal, wantNight){
  const base = baseScore(pal);
  if(!usePassive) return { effective: base, loadout: null };
  const loadout = idealPassiveLoadout(pal, wantNight);
  return { effective: base * (1 + loadout.totalPct/100), loadout };
}

function coverageOK(usedSet, activeRoles){
  for(const role of activeRoles){
    let ok = false;
    for(const name of usedSet){
      const pal = PAL_BY_NAME[name];
      if(pal.work[role] > 0){ ok = true; break; }
    }
    if(!ok) return false;
  }
  return true;
}

let PAL_BY_NAME = {};
PAL_DATA.forEach(p => PAL_BY_NAME[p.name] = p);

function compute(){
  const btn = document.getElementById('computeBtn');
  btn.disabled = true; btn.textContent = "計算中...";
  setTimeout(() => { runCompute(); btn.disabled = false; btn.textContent = "この条件で最適配置を計算する"; }, 30);
}

function runCompute(){
  const slots = parseInt(slotNum.value);
  const activeRoles = ROLES.filter(r => roleWeights[r] > 0).sort((a,b)=>roleWeights[b]-roleWeights[a]);

  const used = new Set();
  const picks = [];

  activeRoles.forEach(role => {
    const candidates = PAL_DATA
      .filter(p => !used.has(p.name) && (p.work[role]||0) > 0)
      .map(p => ({pal:p, ...effectiveScoreOf(p, dayNightBalance)}))
      .sort((a,b) => (b.pal.work[role]-a.pal.work[role]) || (b.effective-a.effective));
    if(candidates.length && picks.length < slots){
      const top = candidates[0];
      picks.push({pal: top.pal, effective: top.effective, loadout: top.loadout, reason: role});
      used.add(top.pal.name);
    }
    if(dayNightBalance && picks.length < slots){
      const thisPickTime = picks.length ? picks[picks.length-1].pal.active : null;
      const oppTime = thisPickTime === "夜" ? "昼" : "夜";
      const opp = candidates.find(c => !used.has(c.pal.name) && c.pal.active === oppTime);
      if(opp){
        picks.push({pal: opp.pal, effective: opp.effective, loadout: opp.loadout, reason: role+"(昼夜補完)"});
        used.add(opp.pal.name);
      }
    }
  });

  const remaining = PAL_DATA
    .filter(p => !used.has(p.name))
    .map(p => ({pal:p, ...effectiveScoreOf(p, dayNightBalance)}))
    .filter(c => c.effective > 0)
    .sort((a,b) => b.effective - a.effective);
  for(const c of remaining){
    if(picks.length >= slots) break;
    picks.push({pal: c.pal, effective: c.effective, loadout: c.loadout, reason: "総合力"});
    used.add(c.pal.name);
  }

  const initialTotal = picks.reduce((s,p)=>s+p.effective,0);

  const maxIter = 150;
  let iterCount = 0;
  let improved = true;
  while(improved && iterCount < maxIter){
    improved = false;
    iterCount++;
    for(let i=0;i<picks.length;i++){
      const current = picks[i];
      let bestCand = null, bestEff = current.effective, bestLoadout = current.loadout;
      for(const cand of PAL_DATA){
        if(used.has(cand.name)) continue;
        const res = effectiveScoreOf(cand, dayNightBalance);
        if(res.effective > bestEff){
          const tempUsed = new Set(used);
          tempUsed.delete(current.pal.name);
          tempUsed.add(cand.name);
          if(coverageOK(tempUsed, activeRoles)){
            bestEff = res.effective; bestCand = cand; bestLoadout = res.loadout;
          }
        }
      }
      if(bestCand){
        used.delete(current.pal.name);
        used.add(bestCand.name);
        picks[i] = {pal: bestCand, effective: bestEff, loadout: bestLoadout, reason: "局所探索で入替"};
        improved = true;
      }
    }
  }

  const finalTotal = picks.reduce((s,p)=>s+p.effective,0);
  renderResult(picks, slots, activeRoles, {initialTotal, finalTotal, iterCount});
}

function renderResult(picks, slots, activeRoles, stats){
  const area = document.getElementById('resultArea');
  const totalMeal = picks.reduce((s,p)=>s+(p.pal.meal||0),0);
  const coveredRoles = new Set();
  picks.forEach(p => { for(const r in p.pal.work) coveredRoles.add(r); });
  const uncovered = activeRoles.filter(r => !coveredRoles.has(r));
  const nightCount = picks.filter(p => p.loadout ? p.loadout.isNightActive : (p.pal.active==="夜"||p.pal.active==="両方")).length;

  const improvePct = stats.initialTotal > 0 ? ((stats.finalTotal - stats.initialTotal)/stats.initialTotal*100) : 0;

  let html = '';
  html += `<div class="summary">
    <div class="metric"><div class="num">${picks.length}/${slots}</div><div class="lbl">配置数</div></div>
    <div class="metric"><div class="num">${totalMeal}</div><div class="lbl">合計食事量</div></div>
    <div class="metric"><div class="num">${nightCount}</div><div class="lbl">24h稼働可能数</div></div>
    <div class="metric"><div class="num">${Math.round(stats.finalTotal)}</div><div class="lbl">合計実効スコア</div></div>
  </div>`;

  html += `<div class="progress-log">局所探索: ${stats.iterCount}パス実行 / 初期スコア${Math.round(stats.initialTotal)} → 最終${Math.round(stats.finalTotal)} (改善${improvePct.toFixed(1)}%)</div>`;

  if(uncovered.length){
    html += `<div class="coverage-warn">枠数不足のため未カバーの役職: ${uncovered.join('、')}</div>`;
  }
  if(activeRoles.length === 0){
    html += `<div class="coverage-warn">役職の重要度が全て「無」です。1つ以上「低」以上に設定してください。</div>`;
  }

  html += '<div class="slot-grid">';
  picks.forEach((p,i) => {
    const pal = p.pal;
    const roleBadges = Object.entries(pal.work)
      .filter(([r,lv]) => roleWeights[r] > 0)
      .sort((a,b)=>b[1]-a[1])
      .map(([r,lv]) => `<span class="badge role">${r} Lv${lv}</span>`).join('');
    const timeBadge = pal.active === "夜" ? '<span class="badge night">夜行性</span>'
      : pal.active === "両方" ? '<span class="badge day">昼</span><span class="badge night">夜</span>'
      : '<span class="badge day">昼行性</span>';
    let passiveBadges = '';
    if(p.loadout){
      passiveBadges = p.loadout.chosen.map(ps => `<span class="badge passive">${ps.name}${ps.pct?'+'+ps.pct+'%':''}</span>`).join('');
    }
    html += `<div class="slot">
      <div class="num-badge">#${i+1}</div>
      <div class="pname">${pal.name}</div>
      <div class="ptype">${pal.types.join('/')} ・ ${p.reason} ・ 実効${Math.round(p.effective)}</div>
      <div>${timeBadge}${roleBadges}</div>
      ${passiveBadges ? '<div style="margin-top:4px;">'+passiveBadges+'</div>' : ''}
      <div class="pskill">◆ ${pal.pskill}</div>
    </div>`;
  });
  for(let i=picks.length; i<slots; i++){
    html += `<div class="slot empty-slot">空き枠</div>`;
  }
  html += '</div>';
  area.innerHTML = html;
}

document.getElementById('computeBtn').addEventListener('click', compute);
compute();
</script>
